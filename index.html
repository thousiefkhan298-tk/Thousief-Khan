    <script>
      (function() {
        if (typeof window !== 'undefined' && typeof console !== 'undefined' && console.error) {
          var origError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var isSkewError = args.some(function(arg) {
              if (typeof arg === 'string') {
                return arg.indexOf('Detected an update time that is in the future') !== -1;
              }
              if (arg && typeof arg.message === 'string') {
                return arg.message.indexOf('Detected an update time that is in the future') !== -1;
              }
              return false;
            });
            if (isSkewError) {
              if (console.debug) {
                console.debug.apply(console, args);
              }
              return;
            }
            return origError.apply(console, args);
          };
        }
      })();
    </script>
